;==================== pytest全局配置说明 ====================
; 文件路径：项目根目录/pytest.ini
; 功能：控制用例执行、控制台输出、HTML报告生成
; 负责人：毛晓雨
;============================================================
[pytest]
# 指定测试脚本根目录
testpaths = ./
# 匹配所有以test_开头的脚本
python_files = test_*.py
# 匹配测试函数
python_functions = test_*
# 执行附加参数：详细输出 + 生成独立HTML报告
addopts = -v --html=report/test_report.html --self-contained-html
# 控制台日志编码
log_cli = true
